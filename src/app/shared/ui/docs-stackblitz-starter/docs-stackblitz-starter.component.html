<div class="stackblitz-starter">
	<button
		tuiButton
		size="m"
		appearance="accent"
		iconStart="@tui.external-link"
		(click)="openStackblitz()"
	>
		Open {{ starter() }} starter in StackBlitz
	</button>
	<p class="stackblitz-hint">A live, editable sandbox with all {{ starter() }} features pre-configured.</p>
</div>
