<div class="docs-layout">
	@if (sidebar.open()) {
		<button class="sidebar-overlay" (click)="closeSidebar()" aria-label="Close sidebar"></button>
	}

	<aside class="docs-sidebar" [class.open]="sidebar.open()">
		<div class="sidebar-top">
			<a routerLink="/" class="sidebar-logo">
				<app-logo size="icon" />
			</a>
			<app-search-trigger />
		</div>
		<div class="sidebar-version">
			<label class="version-label" for="sidebar-version-input">Version</label>
			<button
				id="sidebar-version-input"
				tuiButton
				appearance="flat"
				size="s"
				iconStart="@tui.chevron-down"
				class="version-select-button"
				[tuiDropdown]="versionMenu"
				[tuiDropdownManual]="open()"
				(tuiActiveZoneChange)="open.set($event)"
				(tuiObscured)="open.set(false)"
				(click)="open.update((v) => !v)"
			>
				v{{ versionService.currentVersion() }}
			</button>
			<ng-template #versionMenu>
				<tui-data-list>
					@for (v of versionService.allVersions; track v) {
						<button type="button" tuiOption (click)="versionService.setVersion(v); open.set(false)">v{{ v }}</button>
					}
				</tui-data-list>
			</ng-template>
		</div>
		<app-docs-sidebar />
		<div class="sidebar-footer">
			<a class="repo-link" href="https://github.com/Quenetiq/quenetiq" target="_blank" rel="noopener">
				<tui-icon icon="@tui.github" />
				GitHub
			</a>
		</div>
	</aside>

	<div class="docs-main">
		<header class="docs-header-bar">
			<button
				tuiButton
				appearance="flat"
        size="s"
				iconStart="@tui.menu"
				class="mobile-menu-btn"
				(click)="sidebar.toggle()"
				aria-label="Open sidebar"
			></button>
      <div class="breadcrumbs">
        <app-docs-breadcrumbs />
      </div>
			@if (tocService.sections().length) {
				<button
					tuiButton
					appearance="flat"
					iconStart="@tui.list"
					class="mobile-toc-btn"
          size="xs"
					(click)="tocService.toggle()"
					aria-label="Table of contents"
				></button>
			}
		</header>

		<div class="docs-content">
			@if (contentLoading()) {
				<div class="docs-loader">
					<app-logo size="icon" class="docs-loader-logo" />
				</div>
			}
			<router-outlet />
		</div>
	</div>

	@if (tocService.open()) {
		<button class="toc-overlay" (click)="closeToc()" aria-label="Close table of contents"></button>
	}
	<aside class="docs-toc" [class.open]="tocService.open()">
		<div class="toc-header">
			<div class="toc-heading">On this page</div>
			<button
				tuiIconButton
				type="button"
				iconStart="@tui.x"
				appearance="flat"
				size="xs"
				class="toc-close"
				(click)="closeToc()"
				aria-label="Close table of contents"
			></button>
		</div>
		@if (tocService.sections().length) {
			<app-docs-toc [sections]="tocService.sections()" />
		}
	</aside>
</div>
