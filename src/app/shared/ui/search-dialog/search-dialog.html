@if (visible()) {
	<div class="search-overlay"
		[class.closing]="closing()"
		tabindex="-1"
		(click)="onBackdropClick($event)"
		(keydown.escape)="close()"
	>
		<div class="search-dialog">
			<div class="search-input-wrapper">
				<tui-icon icon="@tui.search" class="search-icon" />
				<input
					#inputEl
					type="text"
					class="search-input"
					placeholder="Search documentation..."
					[value]="searchInput()"
					(input)="onSearch($any($event.target).value)"
				/>
				<kbd class="search-kbd">ESC</kbd>
			</div>

			@if (searchService.loading()) {
				<div class="search-loading">Loading index...</div>
			} @else if (searchService.results().length > 0) {
				<div class="search-results">
					@for (result of searchService.results(); track result.id) {
						<button class="search-result" (click)="goTo(result)">
							<div class="result-title">{{ result.title }}</div>
							@if (result.group) {
								<span class="result-group">{{ result.group }}</span>
							}
							<div class="result-snippet">{{ result.snippet }}</div>
						</button>
					}
				</div>
			} @else if (searchInput() && !searchService.loading()) {
				<div class="search-empty">No results found for "{{ searchInput() }}"</div>
			}
		</div>
	</div>
}
