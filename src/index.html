<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Quenetiq</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="logos/logo.svg" />
		<link rel="icon" type="image/x-icon" href="favicon.ico" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600&family=DM+Mono:ital@0;1&display=swap" rel="stylesheet" />
		<script>
			const THEME_KEY = 'themePreference';
			const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
			const theme = localStorage.getItem(THEME_KEY) ?? 'auto';
			const isDark = theme === 'dark' || (theme === 'auto' && prefersDark);
			document.documentElement.className = isDark ? 'docs-dark-mode' : 'docs-light-mode';
			document.documentElement.setAttribute('tuiTheme', isDark ? 'dark' : 'light');
		</script>
	</head>
	<body>
		<app-root></app-root>
	</body>
</html>
